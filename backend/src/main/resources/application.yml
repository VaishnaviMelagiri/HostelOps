spring:
  application:
    name: hostelops-backend

  datasource:
    # ${VAR:default} reads an environment variable and falls back to the default if unset.
    # The defaults match docker-compose.yml, so `./mvnw spring-boot:run` works with no .env at all
    # locally, while Render can override every value in production without touching this file.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hostelops}
    username: ${DB_USERNAME:hostelops}
    password: ${DB_PASSWORD:hostelops}
    hikari:
      # How long a thread waits for a free connection from the pool before giving up.
      # Hikari's default is 30s, which makes /api/health hang for half a minute when Postgres is
      # down instead of reporting DOWN promptly - long enough for Render's health check to time out
      # and for a user to assume the page is broken rather than the database. If we cannot get a
      # connection within 5s the request was doomed anyway, so fail fast and say so.
      connection-timeout: 5000
      validation-timeout: 2000

  jpa:
    hibernate:
      # NEVER 'update' or 'create'. Flyway owns the schema; Hibernate only checks that the tables it
      # expects already exist. 'update' would let a careless entity change silently alter the
      # production database - including quietly dropping the partial unique indexes that this whole
      # project is built around. With 'validate', a mismatch is a loud startup failure instead.
      ddl-auto: validate
    open-in-view: false          # see README - avoids lazy-loading inside the HTTP response
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Phase 1 intentionally ships zero migrations. Flyway starts, creates its own history table,
    # finds nothing to apply, and moves on. V1__core_tables.sql arrives in Phase 2.
    baseline-on-migrate: true

  jackson:
    # Serialise timestamps as ISO-8601 strings ("2026-08-09T12:41:07Z"), not as epoch numbers,
    # so the TypeScript side can hand them straight to `new Date(...)`.
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    # Don't leak stack traces to HTTP clients.
    include-stacktrace: never
    include-message: always

hostelops:
  cors:
    # Comma-separated. Vite's dev server is 5173; Phase 12 adds the Vercel URL here.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    org.flywaydb: INFO
    com.hostelops: DEBUG
